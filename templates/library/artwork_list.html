{% extends "library/base.html" %}{% block library_title %}Artwork Library{% endblock %}{% block library_content %}<form method="get" class="filter-bar"><label for="art-q">Search</label><input id="art-q" name="q" type="search"><label for="art-type">Type</label><select id="art-type" name="type"><option value="">All</option>{% for value,label in types %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select><label for="art-status">Status</label><select id="art-status" name="status"><option value="">All</option>{% for value,label in statuses %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select><label><input type="checkbox" name="primary" value="1"> Primary</label><button class="button">Filter</button></form><div class="gallery-grid">{% for item in artwork %}<a class="art-card" href="{% url 'library-artwork-detail' item.id %}"><img src="{% url 'library-artwork-file' item.id %}" alt="{{ item.alt_text|default:item.title }}" loading="lazy"><strong>{{ item.title }}</strong><span>{{ item.get_artwork_type_display }} · {{ item.get_status_display }}</span></a>{% empty %}<p class="empty-state">No Artwork matches these filters.</p>{% endfor %}</div>{% endblock %}
