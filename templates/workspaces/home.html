{% extends "base.html" %}

{% block title %}Workspace — Strange Novelty{% endblock %}

{% block content %}
  <h1>Workspace ready</h1>
  <p>{{ workspace.name }}</p>
  <p><a href="{% url 'scene-list' %}">Open Scenes</a></p>
  <p><a href="{% url 'scene-search' %}">Search Scenes</a></p>

  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Sign out</button>
  </form>
{% endblock %}
