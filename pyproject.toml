[project]
name = "strange-novelty"
version = "0.0.0"
description = "Private, secure creative workspace for a solo author and artist"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography>=46,<47",
    "django>=5.2.14,<5.3",
    "pyotp>=2.9,<3",
    "psycopg>=3.3,<3.4",
    "webauthn>=2.7,<3",
    "python-docx>=1.2,<2",
    "reportlab>=4.4,<5",
]

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
lint = [
    "ruff>=0.12,<1",
]
test = [
    "psycopg-binary>=3.3,<3.4",
    "pytest>=8.4,<10",
    "pytest-django>=4.11,<5",
]
typing = [
    "mypy>=1.16,<2",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typing" },
]
production = [
    "gunicorn>=23,<24",
    "psycopg-c>=3.3,<3.4",
    "whitenoise>=6.9,<7",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    "private-data",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "DJ",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.4"
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["src"]
DJANGO_SETTINGS_MODULE = "strange_novelty.settings.test"
markers = [
    "postgresql: requires the configured PostgreSQL test database",
]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
check_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = [
    "^private-data/",
    "^src/accounts/migrations/",
]
